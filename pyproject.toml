[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-mcp-bridge"
version = "0.1.0"
description = "Turn thousands of OpenAPI endpoints into a handful of MCP tools an LLM can actually navigate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
openapi-bridge-stats = "openapi_bridge.registry:main"

[tool.setuptools]
packages = ["openapi_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
